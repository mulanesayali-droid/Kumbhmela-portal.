{% extends "base.html" %}
{% block content %}

<div class="card glass-card mx-auto mt-4 p-4" style="max-width: 500px;">
  <div class="card-body">
    <h4 class="text-center mb-3">🅿️ Parking Agent Form</h4>

    {% if success %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      Parking agent added successfully!
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <form method="POST" class="p-2">
      <div class="mb-2">
        <label class="form-label small">Name</label>
        <input type="text" class="form-control form-control-sm" name="name" required>
      </div>

      <div class="mb-2">
        <label class="form-label small">Location</label>
        <select name="location" class="form-select form-select-sm" required>
          <option value="">-- Select Location --</option>
          <option>Trimbakeshwar</option>
          <option>Ramkund</option>
          <option>Tapovan</option>
          <option>Panchavati</option>
          <option>Godavari Ghat</option>
          <option>Sadhugram</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="form-label small">Contact</label>
        <input type="text" class="form-control form-control-sm" name="contact" required>
      </div>

      <div class="mb-2">
        <label class="form-label small">Shift</label>
        <select name="shift" class="form-select form-select-sm" required>
          <option value="">-- Select Shift --</option>
          <option>Morning</option>
          <option>Evening</option>
          <option>Night</option>
        </select>
      </div>

      <div class="d-flex justify-content-between mt-3 flex-wrap gap-2">
        <button type="submit" class="btn btn-primary btn-sm">Submit</button>
        {% if show_view_btn %}
        <a href="{{ view_url }}" class="btn btn-secondary btn-sm">View Agents</a>
        {% endif %}
        <a href="/" class="btn btn-outline-dark btn-sm">🏠 Home</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
