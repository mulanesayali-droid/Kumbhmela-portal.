<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumbhmela Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("/static/images/kumbhmela_bg.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Overlay for readability */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);  
            z-index: -1;
        }

        /* Cards */
        .card {
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px) rotateX(2deg);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        /* Glass effect for forms/cards */
        .glass-card {
            background: rgba(238, 234, 234, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(238, 234, 234, 0.3);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* Buttons */
        .btn {
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }

        /* Table row animations */
        .table tbody tr {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInRow 0.5s forwards;
        }
        .table tbody tr:nth-child(even) { animation-delay: 0.1s; }
        .table tbody tr:nth-child(odd) { animation-delay: 0.2s; }
        @keyframes fadeInRow {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .d-flex.flex-wrap.justify-content-center.gap-3 a.btn { width: 100%; text-align: center; }
            .container { padding: 10px; }
        }

        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Kumbhmela Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    
                    

                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-3">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
