{% extends "base.html" %}
{% block content %}

<div class="card glass-card mx-auto mt-4 p-4" style="max-width: 500px;">
  <div class="card-body">
    <h4 class="text-center mb-3">🚗 Vehicle Form</h4>

    {% if success %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      Vehicle added successfully!
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <form method="POST" class="p-2">
      <div class="mb-2">
        <label class="form-label small">Vehicle Name</label>
        <input type="text" class="form-control form-control-sm" name="vehicle_name" required>
      </div>

      <div class="mb-2">
        <label class="form-label small">Type</label>
        <select name="type" class="form-select form-select-sm" required>
        <option value="">-- Select Type --</option>
        <option>Car</option>
        <option>Bike</option>
        <option>Bus</option>
        <option>Truck</option>
    </select>
      </div>

      <div class="mb-2">
        <label class="form-label small">Rent Amount</label>
        <input type="number" step="0.01" class="form-control form-control-sm" name="rent_amount">
      </div>

      <div class="d-flex justify-content-between mt-3 flex-wrap gap-2">
        <button type="submit" class="btn btn-warning btn-sm text-dark">Submit</button>
        {% if show_view_btn %}
        <a href="{{ view_url }}" class="btn btn-secondary btn-sm">View Vehicles</a>
        {% endif %}
        <a href="/" class="btn btn-outline-dark btn-sm">🏠 Home</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
